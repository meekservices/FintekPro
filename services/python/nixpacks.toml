[phases.setup]
# Python 3.12 — prebuilt wheels exist for numpy/scipy/scikit-learn/asyncpg.
# No gcc needed; pip resolves all packages from PyPI binary wheels.
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --log-level info"
