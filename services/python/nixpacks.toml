[phases.setup]
# Pin Python 3.11 — tested with numpy/scipy/scikit-learn stack
nixPkgs = ["python311", "python311Packages.pip", "gcc", "libffi"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --log-level info"
