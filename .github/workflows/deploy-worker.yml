name: Deploy Enrichment Worker to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'workers/enrichment-worker.ts'
      - 'server/cron-enrichment.ts'
      - 'Dockerfile.worker'
      - '.github/workflows/deploy-worker.yml'

env:
  PROJECT_ID: fintekpro
  REGION: asia-south1
  SERVICE_NAME: fintekpro-enrichment
  REPO_NAME: fintekpro-repo

jobs:
  deploy:
    name: Build and Deploy Worker to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.worker \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:latest .

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }} --all-tags

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --port 8002 \
            --memory 2Gi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 1 \
            --max-instances 2 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,INSTANCE_CONNECTION_NAME=fintekpro:asia-south1:fintekpro-db" \
            --set-secrets "PRODUCTION_DATABASE_URL=PRODUCTION_DATABASE_URL:latest,FINNHUB_API_KEY=FINNHUB_API_KEY:latest,ALPHA_VANTAGE_API_KEY=ALPHA_VANTAGE_API_KEY:latest" \
            --add-cloudsql-instances fintekpro:asia-south1:fintekpro-db

      - name: Show Output URL
        run: |
          echo "Deployment successful! Worker URL:"
          gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)'
