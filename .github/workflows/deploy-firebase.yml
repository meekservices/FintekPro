name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'shared/**'
      - '.github/workflows/deploy-firebase.yml'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.firebaserc'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

env:
  PROJECT_ID: fintekpro

jobs:
  build-and-deploy:
    name: Build Vite Frontend & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ Build failed: dist/public/index.html not found"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -lh dist/public/

      - name: Check Secret Visibility (Diagnostic)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT is EMPTY or NOT FOUND"
            exit 1
          fi
          echo "✅ FIREBASE_SERVICE_ACCOUNT is present (length: ${#FIREBASE_SA})"
          # Validate it's parseable JSON
          echo "$FIREBASE_SA" | python3 -c "import json,sys; d=json.load(sys.stdin); print('✅ Valid JSON, project:', d.get('project_id','?'))"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Write service account JSON to a temp file
          SA_FILE=$(mktemp /tmp/firebase-sa-XXXXXX.json)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"

          # Verify valid JSON
          python3 -c "import json,sys; json.load(open('$SA_FILE'))" || {
            echo "❌ FIREBASE_SERVICE_ACCOUNT is not valid JSON"
            rm -f "$SA_FILE"
            exit 1
          }
          echo "✅ Service account JSON verified"

          # Deploy using GOOGLE_APPLICATION_CREDENTIALS (ADC)
          GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE" \
            npx -y firebase-tools@latest deploy \
              --only hosting \
              --project "$PROJECT_ID" \
              --non-interactive

          rm -f "$SA_FILE"
          echo "✅ Firebase Hosting deploy complete"
