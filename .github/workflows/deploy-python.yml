name: Deploy Python Service to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'services/python/**'

env:
  PROJECT_ID: fintekpro
  REGION: asia-south1
  SERVICE_NAME: fintekpro-python
  REPO_NAME: fintekpro-repo

jobs:
  deploy:
    name: Build and Deploy Python Service to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker Image
        working-directory: services/python
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:latest \
            .

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }} --all-tags

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |-
            NODE_ENV=production
          secrets: |-
            DATABASE_URL=DATABASE_URL:latest
            PRODUCTION_DATABASE_URL=PRODUCTION_DATABASE_URL:latest
            PYTHON_SERVICE_SECRET=PYTHON_SERVICE_SECRET:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            FINNHUB_API_KEY=FINNHUB_API_KEY:latest
          flags: |-
            --port=8001
            --memory=2Gi
            --cpu=2
            --timeout=300
            --cpu-boost
            --min-instances=0
            --max-instances=3
            --allow-unauthenticated
            --add-cloudsql-instances=fintekpro:asia-south1:fintekpro-db

      - name: Show Output URL
        run: echo ${{ steps.deploy.outputs.url }}
