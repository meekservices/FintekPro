name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: fintekpro
  REGION: asia-south1
  APP_SERVICE: fintekpro-app
  SCHEMA_REPAIR_JOB: fintekpro-schema-repairs
  PYTHON_SERVICE: fintekpro-python
  REPO_NAME: fintekpro-repo

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fintekpro
          channelId: live

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 1. Build & Deploy Node.js Backend
      - name: Build Node Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.APP_SERVICE }}:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.APP_SERVICE }}:${{ github.sha }}

      - name: Run Schema Repair Job
        run: |
          gcloud run jobs deploy ${{ env.SCHEMA_REPAIR_JOB }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.APP_SERVICE }}:${{ github.sha }} \
            --command=node \
            --args=dist/startup/schema-repairs-runner.js \
            --set-env-vars="NODE_ENV=production,INSTANCE_CONNECTION_NAME=fintekpro:asia-south1:fintekpro-db" \
            --set-secrets="PRODUCTION_DATABASE_URL=PRODUCTION_DATABASE_URL:latest,DATABASE_URL=DATABASE_URL:latest" \
            --add-cloudsql-instances=fintekpro:asia-south1:fintekpro-db \
            --memory=2Gi \
            --cpu=1 \
            --task-timeout=900 \
            --max-retries=0
          gcloud run jobs execute ${{ env.SCHEMA_REPAIR_JOB }} \
            --region=${{ env.REGION }} \
            --wait

      - name: Deploy Node Service
        run: |
          gcloud run deploy ${{ env.APP_SERVICE }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.APP_SERVICE }}:${{ github.sha }} \
            --set-env-vars="NODE_ENV=production,RUN_STARTUP_MIGRATIONS=false,INSTANCE_CONNECTION_NAME=fintekpro:asia-south1:fintekpro-db,CUSTOM_DOMAIN=fintekpro.com" \
            --set-secrets="\
              PRODUCTION_DATABASE_URL=PRODUCTION_DATABASE_URL:latest,\
              DATABASE_URL=DATABASE_URL:latest,\
              SESSION_SECRET=SESSION_SECRET:latest,\
              FIELD_ENCRYPTION_KEY=FIELD_ENCRYPTION_KEY:latest,\
              ENCRYPTION_MASTER_KEY=ENCRYPTION_MASTER_KEY:latest,\
              CASHFREE_APP_ID=CASHFREE_APP_ID:latest,\
              CASHFREE_SECRET_KEY=CASHFREE_SECRET_KEY:latest,\
              CASHFREE_ENVIRONMENT=CASHFREE_ENVIRONMENT:latest,\
              OPENAI_API_KEY=OPENAI_API_KEY:latest,\
              GEMINI_API_KEY=GEMINI_API_KEY:latest,\
              SANDBOX_API_KEY=SANDBOX_API_KEY:latest,\
              SANDBOX_API_SECRET=SANDBOX_API_SECRET:latest,\
              SANDBOX_BASE_URL=SANDBOX_BASE_URL:latest,\
              TRUTHSCREEN_USERNAME=TRUTHSCREEN_USERNAME:latest,\
              TRUTHSCREEN_PASSWORD=TRUTHSCREEN_PASSWORD:latest,\
              TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,\
              TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,\
              TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest,\
              TWILIO_PRIMARY_PHONE=TWILIO_PRIMARY_PHONE:latest,\
              TWILIO_MESSAGING_SERVICE_SID=TWILIO_MESSAGING_SERVICE_SID:latest,\
              TWILIO_VERIFY_SERVICE_SID=TWILIO_VERIFY_SERVICE_SID:latest,\
              PYTHON_SERVICE_URL=PYTHON_SERVICE_URL:latest,\
              PYTHON_SERVICE_SECRET=PYTHON_SERVICE_SECRET:latest,\
              FINNHUB_API_KEY=FINNHUB_API_KEY:latest,\
              ZOHO_CLIENT_ID=ZOHO_CLIENT_ID:latest,\
              ZOHO_CLIENT_SECRET=ZOHO_CLIENT_SECRET:latest,\
              ZOHO_REFRESH_TOKEN=ZOHO_REFRESH_TOKEN:latest,\
              ZOHO_WEBHOOK_SECRET=ZOHO_WEBHOOK_SECRET:latest,\
              COMPLIANCE_SECRET=COMPLIANCE_SECRET:latest,\
              GROQ_API_KEY=GROQ_API_KEY:latest" \
            --add-cloudsql-instances=fintekpro:asia-south1:fintekpro-db \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --timeout=300 \
            --cpu-boost

      # 2. Build & Deploy Python Analytics
      - name: Build Python Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.PYTHON_SERVICE }}:${{ github.sha }} ./services/python
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.PYTHON_SERVICE }}:${{ github.sha }}

      - name: Deploy Python Service
        run: |
          gcloud run deploy ${{ env.PYTHON_SERVICE }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.PYTHON_SERVICE }}:${{ github.sha }} \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,PYTHON_SERVICE_SECRET=PYTHON_SERVICE_SECRET:latest" \
            --add-cloudsql-instances=fintekpro:asia-south1:fintekpro-db \
            --allow-unauthenticated
