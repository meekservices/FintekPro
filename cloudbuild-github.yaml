# cloudbuild-github.yaml
# INFRA-H2: Added Docker BuildKit layer caching via --cache-from/--cache-to.
#   Expected build time: 12 min → 3–4 min (when only app code changes, not node_modules).
# INFRA-M5: Timeout reduced from 1800s (30 min) to 600s (10 min) as a build quality gate.
#   If a build exceeds 10 min, it means caching is broken or npm install regressed.
#
# Bypasses local gcloud tarfile crash on macOS ARM by cloning from GitHub directly.
steps:

# Step 1: Clone source from GitHub (shallow, main branch only)
- name: 'gcr.io/cloud-builders/git'
  args:
  - clone
  - '--depth=1'
  - '--branch=main'
  - 'https://github.com/meekservices/FintekPro.git'
  - '/workspace/app'

# Step 2: Confirm build source (git log)
- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'sh'
  args:
  - '-c'
  - 'git -C /workspace/app log --oneline -1 && echo "Build source confirmed"'

# Step 3: Build Docker image with BuildKit layer caching
# INFRA-H2: --cache-from pulls the previous :cache tag from Artifact Registry.
#           --cache-to pushes layer cache back after a successful build.
#           DOCKER_BUILDKIT=1 enables BuildKit (required for cache-from/cache-to).
# Both :latest and :cache tags are pushed so cache is always fresh.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    docker pull asia-south1-docker.pkg.dev/fintekpro/fintekpro-repo/fintekpro-app:cache || true
    docker build \
      --cache-from asia-south1-docker.pkg.dev/fintekpro/fintekpro-repo/fintekpro-app:cache \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t asia-south1-docker.pkg.dev/fintekpro/fintekpro-repo/fintekpro-app:latest \
      -t asia-south1-docker.pkg.dev/fintekpro/fintekpro-repo/fintekpro-app:cache \
      /workspace/app
  env:
  - 'DOCKER_BUILDKIT=1'

images:
- 'asia-south1-docker.pkg.dev/fintekpro/fintekpro-repo/fintekpro-app:latest'
- 'asia-south1-docker.pkg.dev/fintekpro/fintekpro-repo/fintekpro-app:cache'

# INFRA-M5: Quality gate — if build takes >10 min, caching is broken or install regressed.
# (was 1800s / 30 min — no incentive to fix slow builds)
timeout: '600s'

# ── Post-deploy infrastructure commands (run once manually) ──────────────────
# INFRA-H3: Set min-instances to eliminate cold starts:
#   gcloud run services update fintekpro-app \
#     --min-instances=1 --max-instances=5 \
#     --region=asia-south1
#
# INFRA-H5: Register liveness probe:
#   gcloud run services update fintekpro-app \
#     --liveness-probe-http-get-path=/api/health \
#     --liveness-probe-initial-delay=30 \
#     --liveness-probe-period=10 \
#     --region=asia-south1
#
# INFRA-H1: Provision Redis (GCP Memorystore):
#   gcloud redis instances create fintekpro-cache \
#     --size=1 --region=asia-south1 \
#     --redis-version=redis_7_0 --tier=basic
#   Then set REDIS_URL secret in Cloud Run.
#
# INFRA-C1: Migrate secrets to Secret Manager:
#   gcloud secrets create OPENAI_API_KEY --data-file=-   <<< "YOUR_KEY"
#   gcloud run services update fintekpro-app \
#     --update-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest
