[build]
builder = "NIXPACKS"
# Increase Node heap for Vite's build; esbuild bundles the server
buildCommand = "NODE_OPTIONS='--max-old-space-size=2048' npm run build"

[deploy]
startCommand = "bash scripts/start-production.sh"
# /api/health returns { status:"ok", ready:true } once DB + auth are up
healthcheckPath = "/api/health"
# Allow up to 5 min for cold start (schema sync + warm caches)
healthcheckTimeout = 300
# Give the server 20 s to drain live requests before SIGKILL on redeploy
drainSeconds = 20
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
