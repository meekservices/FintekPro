[phases.setup]
nixPkgs = [
  # Node runtime
  "nodejs_20",

  # Native npm module build tools (required for bufferutil, bcrypt, sharp, etc.)
  "python3",
  "gcc",
  "gnumake",
  "pkg-config",

  # Headless Chromium — required for WhatsApp QR (whatsapp-web.js / Puppeteer)
  "chromium",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "libxkbcommon",
  "mesa",
  "expat",
  "glib",
  "dbus",
  "pango",
  "cairo",
  "freetype",
  "fontconfig",
  "alsa-lib"
]
