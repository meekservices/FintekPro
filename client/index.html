<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FintekPro" />
    <meta name="description" content="FintekPro is India's leading SEBI-compliant financial services platform for personal finance, portfolio management, mutual funds, stocks, bonds, and AI-powered investment insights." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FintekPro - Smart Financial Services Platform" />
    <meta property="og:description" content="Comprehensive SEBI-compliant platform for portfolio management, mutual funds, stocks, bonds, and AI-powered investment insights. Empowering investors and financial advisors." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:site_name" content="FintekPro" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FintekPro - Smart Financial Services Platform" />
    <meta name="twitter:description" content="India's leading SEBI-compliant financial services platform for personal finance, portfolio management, and AI-powered investment insights." />
    <meta name="twitter:image" content="/favicon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" id="favicon-link" />
    <link rel="manifest" href="/api/system/portal-manifest.json" id="manifest-link" />
    <link rel="apple-touch-icon" href="/icon-192.png" id="apple-touch-icon-link" />
    <script>
      (function() {
        fetch('/api/system/portal-meta')
          .then(function(r) { return r.json(); })
          .then(function(meta) {
            var iconMap = { main: '/icon-192.png', partner: '/icon-partner.png', agent: '/icon-agent.png', admin: '/icon-admin.png' };
            var icon = iconMap[meta.portal_type] || '/icon-192.png';
            document.getElementById('favicon-link').href = icon;
            document.getElementById('apple-touch-icon-link').href = icon;
            var tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.content = meta.primary_color;
            var awt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (awt) awt.content = meta.label;
          })
          .catch(function() {});
      })();
    </script>
